@media(prefers-color-scheme:light){:root{--bg:#eef2fa;--bg2:#e2e9f6;--panel:#fff;--line:#c9d5ea;--tx:#14203b;--mut:#566789;--gold:#9a6c00;--blue:#2c64b0}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 50% -100px,var(--bg2),var(--bg));background-attachment:fixed;color:var(--tx);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:16px;max-width:1200px;margin:0 auto;padding:18px 14px 8px}
header img{width:84px;height:84px;filter:drop-shadow(0 4px 14px #0008)}
header h1{margin:0;font-size:clamp(20px,4.5vw,34px);letter-spacing:.16em;color:var(--gold);line-height:1.1}
header p{margin:3px 0 0;color:var(--mut);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.wk{margin-left:auto;text-align:right;font-size:12px;color:var(--mut)}
.wk input{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav button{flex:none;background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
nav button.on{background:linear-gradient(135deg,var(--gold),#c9972a);color:#111;border-color:transparent;font-weight:700}
main{max-width:1200px;margin:0 auto;padding:16px 12px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 6px 24px #0003}
.card h2{margin:0 0 12px;font-size:13px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--blue) 10%,transparent)}
.wrap{overflow-x:auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
td input.d{width:54px;text-align:center;padding:5px}td input.n{width:150px}
.btn{background:var(--bg2);color:var(--tx);border:1px solid var(--line);padding:8px 13px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--gold)}.btn.p{background:linear-gradient(135deg,var(--gold),#c9972a);color:#111;border-color:transparent;font-weight:700}.btn.x{color:var(--bad)}
.tag{display:inline-block;min-width:34px;text-align:center;padding:2px 9px;border-radius:99px;font-weight:700;font-size:12px;color:#fff}
.s2{background:var(--ok)}.s1{background:var(--warn)}.s0{background:var(--bad)}.sNH{background:var(--nh)}.sIN{background:var(--in)}.sEX{background:var(--ex)}.sLOA{background:#e07b39}.sNA{background:var(--line);color:var(--mut)}
.bar{height:7px;background:var(--line);border-radius:5px;min-width:70px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:24px;color:var(--tx)}.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.rem{color:var(--mut);font-size:13px;margin:5px 0}
.log{background:var(--bg);border:1px dashed var(--gold);border-radius:12px;padding:12px;margin-bottom:12px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px;margin:10px 0;max-height:180px;overflow:auto}
.chk label{font-size:13px}
.medal{font-weight:800;color:var(--gold);width:28px;display:inline-block}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#111;padding:9px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
main>*{animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
header img{animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 16px var(--gold))}}
#fp{position:relative;width:62px;height:62px;flex:none;border-radius:50%;border:1px solid var(--gold);background:var(--panel);color:var(--gold);cursor:pointer;display:grid;place-items:center;overflow:hidden;animation:pulse 2.4s infinite}
#fp svg{width:38px;height:38px}
#fp::after{content:"";position:absolute;left:0;right:0;top:-4px;height:3px;background:var(--blue);box-shadow:0 0 10px var(--blue);opacity:0}
#fp.scan::after{opacity:1;animation:sc 1.2s ease-in-out}
#fp.scan{color:var(--ok);border-color:var(--ok)}
@keyframes sc{50%{top:60px}}
@keyframes pulse{from{box-shadow:0 0 0 0 #e8bd4f66}to{box-shadow:0 0 0 16px #e8bd4f00}}
.login{max-width:380px;margin:30px auto;text-align:center}.login input{width:100%;margin:6px 0}
input:disabled,select:disabled{opacity:.9;border-color:transparent;background:transparent;cursor:default;-webkit-appearance:none;appearance:none;color:var(--tx)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s}
#intro.out{opacity:0;pointer-events:none}
#intro #fp{width:92px;height:92px}#intro #fp svg{width:56px;height:56px}
#intro #fp.scan::after{animation:sc2 1.2s ease-in-out infinite}@keyframes sc2{50%{top:89px}}
#intro p{color:var(--mut);letter-spacing:.28em;font-size:13px;text-transform:uppercase;text-align:center;padding:0 20px;margin:0}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50}#modal.on{display:grid}
.mb{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:18px;width:min(420px,92vw)}.mb p{margin:0 0 12px}
.mb textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;margin-bottom:12px}
#intro img{width:200px;height:200px;filter:drop-shadow(0 4px 16px #0009);animation:glow 4s ease-in-out infinite}
#intro h1{margin:0;color:var(--gold);letter-spacing:.14em;font-size:clamp(17px,5vw,30px);text-align:center;padding:0 16px;line-height:1.2}
#intro{gap:18px}
#tb{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:linear-gradient(135deg,var(--gold),#c9972a);color:#111;border:0;border-radius:99px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 20px #0006}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:40;background:var(--panel);border-left:1px solid var(--gold);padding:calc(14px + env(safe-area-inset-top,0px)) 14px 20px;overflow:auto;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:-10px 0 40px #0008}
#dr.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--gold);letter-spacing:.14em}
.dt{margin:16px 0 6px;font-size:12px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.hl,input.n.h2,input.n.h1,input.n.h0,input.n.hNH,input.n.hIN,input.n.hEX,input.n.hLOA{color:#fff;font-weight:600}
.hl{padding:2px 9px;border-radius:6px;display:inline-block}
.h2{background:var(--ok)}.h1{background:var(--warn);color:#111!important}.h0{background:var(--bad)}.hNH{background:var(--nh)}.hIN{background:var(--in)}.hEX{background:var(--ex)}.hLOA{background:#e07b39}.hNA{background:transparent}
input.n.h1{color:#111}
.dw{margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.dw summary{cursor:pointer;padding:14px 0;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:13px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
.dw summary::-webkit-details-marker{display:none}.dw summary::after{content:"\25BE";transition:transform .25s}.dw[open] summary::after{transform:rotate(180deg)}
.dw summary small{margin-left:auto;color:var(--mut);letter-spacing:.04em;text-transform:none;font-weight:400}.dw .stats{margin-bottom:14px}
#qr{font-size:11px;overflow-x:auto}#qr>*{min-width:520px}
.qu{display:flex;justify-content:space-between;margin:14px 0 4px;color:var(--gold);font-size:12px;font-weight:700}
.ql{display:grid;grid-template-columns:minmax(0,1fr) 32px 48px repeat(7,28px) 30px 40px 32px;gap:4px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.ql>*{text-align:center;font-style:normal}.ql .nm{text-align:left;overflow:hidden}
.ql .nm .hl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 6px;font-size:11px;vertical-align:middle}
.ql.qh{color:var(--mut);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--gold)}
.ql .td{color:var(--gold);font-weight:700}
.qy{color:var(--ok);font-weight:800}.qn{color:var(--bad);font-weight:800}
.ul{border-radius:50%;vertical-align:middle;margin-right:8px;flex:none;object-fit:cover}
nav .ul{margin-right:6px}.qu span:first-child{display:flex;align-items:center}
#intro{justify-content:space-between;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
#intro .it{display:flex;flex-direction:column;align-items:center;gap:14px}
#intro .ib{display:flex;flex-direction:column;align-items:center;gap:14px}
.pu{margin:12px 0}.puh{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:700;font-size:13px}
.cat td{background:var(--bg2);color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px;padding:5px 8px}
.qc{margin:6px 0 2px;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
@media print{#tb,#dr,nav,.tools,.log,.btn,footer{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none}}
</style>
</head>

 $("q").oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p)};
 $("fs").onchange=e=>{fs=e.target.value;render()};$("so").onchange=e=>{so=e.target.value;render()};
 $("add").onclick=()=>ask("Add a new personnel to "+tab+"?",()=>{L.push({name:"",rank:RANKS[0],days:Array(7).fill(""),st:"EX",added:Date.now(),auto:1});q="";fs="";save();render()});
 $("bulk").onclick=()=>ask("Paste usernames, one per line. They are added as "+RANKS[0]+" with Exemption status for 1 week.",t=>{if(!t)return;t.split(/\n|,/).map(s=>s.trim()).filter(Boolean).forEach(n=>L.push({name:n,rank:RANKS[0],days:Array(7).fill(""),st:"EX",added:Date.now(),auto:1}));save();render();toast("Personnel added")},1);
 $("lg").onclick=()=>{logOpen=!logOpen;render()};
 if(logOpen){$("le").onchange=e=>{$("lp").value=S.points[e.target.value]||""};$("lp").value=S.points[$("le").value]||"";
  $("lgo").onclick=()=>{const p=+$("lp").value,d=+$("ld").value,ids=[...m.querySelectorAll(".chk input:checked")].map(x=>+x.value);if(!p||!ids.length)return toast("Enter points and pick personnel");ids.forEach(i=>L[i].days[d]=(+L[i].days[d]||0)+p);save();logOpen=false;render();toast(`+${p} to ${ids.length} personnel`)}}

 $("ur").onclick=()=>{urOpen=!urOpen;render()};
 m.querySelectorAll("[data-ur]").forEach(e=>e.onchange=()=>{const i=+e.dataset.ur,o=S.ur[tab][i],v=e.value.trim();if(v){S.ur[tab][i]=v;if(S.cat[o]){S.cat[v]=S.cat[o];delete S.cat[o]}L.forEach(x=>{if(x.ur===o)x.ur=v});save()}render()});
 m.querySelectorAll("[data-urd]").forEach(b=>b.onclick=()=>ask("Remove this unit rank?",()=>{S.ur[tab].splice(+b.dataset.urd,1);save();render()}));
 m.querySelectorAll("[data-uc]").forEach(s=>s.onchange=()=>{S.cat[S.ur[tab][+s.dataset.uc]]=s.value;save();render()});
 m.querySelectorAll("[data-uu]").forEach(b=>b.onclick=()=>{const a=S.ur[tab],i=+b.dataset.uu;if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];save();render()}});
 m.querySelectorAll("[data-ud]").forEach(b=>b.onclick=()=>{const a=S.ur[tab],i=+b.dataset.ud;if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];save();render()}});
 $("ura").onclick=()=>{const v=$("urn").value.trim();if(!v)return;ask("Add unit rank "+v+"?",()=>{if(!S.ur[tab].includes(v)){S.ur[tab].push(v);save()}render()})};
 $("prt").onclick=()=>ask("Print this page?",()=>print());
 $("csv").onclick=()=>ask("Download "+tab+" as CSV?",()=>dl(tab.replace(/ /g,"-")+".csv",["Username,Rank,"+DAYS.join(",")+",Total,Status",...L.map(x=>[x.name,x.rank,...x.days,total(x),status(x)].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","))].join("\n"),"text/csv"));
 m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>ask("Remove this personnel permanently?",()=>{L.splice(+b.dataset.del,1);save();render();toast("Personnel removed")}));
 m.querySelectorAll("[data-mv]").forEach(s=>s.onchange=()=>{if(s.value==="Move")return;const to=s.value,i=+s.dataset.mv;ask("Move "+(L[i].name||"this personnel")+" to "+to+"?",()=>{const [x]=L.splice(i,1);S.units[to].push(x);save();render();toast("Moved to "+to)},0,()=>render())});
 m.querySelectorAll("input[data-i],select[data-i]").forEach(e=>e.onchange=()=>{const x=L[+e.dataset.i];
  if(e.dataset.d!==undefined)x.days[+e.dataset.d]=e.value.replace(/\D/g,"");else if(e.dataset.f==="q")x.q=e.value.replace(/\D/g,"");else if(e.dataset.f==="name")x.name=e.value.trim();else{x[e.dataset.f]=e.value;if(e.dataset.f==="st")x.auto=0}save();render()})}
function txtBox(msg,text,paste,ok){const m=document.getElementById("modal");m.innerHTML=`<div class="mb"><p>${msg}</p><textarea id="tb2" rows="8" style="width:100%"${paste?' placeholder="Paste the exported text here"':" readonly"}></textarea><div class="tools" style="justify-content:flex-end;margin:0"><button class="btn" id="tx">Close</button>${paste?'<button class="btn p" id="tk">Import</button>':'<button class="btn p" id="tc">Copy</button>'}</div></div>`;const ta=document.getElementById("tb2");ta.value=text||"";m.classList.add("on");if(!paste){ta.focus();ta.select()}document.getElementById("tx").onclick=()=>m.classList.remove("on");if(paste)document.getElementById("tk").onclick=()=>{const v=ta.value;m.classList.remove("on");ok(v)};else document.getElementById("tc").onclick=()=>{ta.focus();ta.select();let o=0;try{o=document.execCommand("copy")}catch(e){}toast(o?"Copied":"Press and hold to copy")}}
function dl(n,t,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:mime}));a.download=n;a.click()}
const wk=document.getElementById("wk");wk.value=S.week;wk.onchange=()=>{S.week=wk.value;save()};
function ask(msg,ok,input,no){const m=document.getElementById("modal");m.innerHTML=`<div class="mb"><p>${msg}</p>${input?'<textarea id="mi" rows="6" placeholder="One username per line"></textarea>':""}<div class="tools" style="justify-content:flex-end;margin:0"><button class="btn" id="mn">Cancel</button><button class="btn p" id="my">Confirm</button></div></div>`;m.classList.add("on");document.getElementById("mn").onclick=()=>{m.classList.remove("on");if(no)no()};document.getElementById("my").onclick=()=>{const v=input?document.getElementById("mi").value:"";m.classList.remove("on");ok(v)}}
const fp=document.getElementById("fp"),intro=document.getElementById("intro"),SS=window.speechSynthesis;
function pick(){const en=SS.getVoices().filter(x=>/^en/i.test(x.lang));return en.find(x=>/Google UK English Male|Daniel|Arthur|Oliver|Ryan|George|Guy/i.test(x.name))||en.find(x=>/male/i.test(x.name)&&!/female/i.test(x.name))||en.find(x=>/GB|UK/i.test(x.lang))||en[0]}
function chime(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[520,780,1040].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+i*.12;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.15,s+.03);g.gain.exponentialRampToValueAtTime(.0001,s+.5);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+.55)})}catch(e){}}
function say(s){if(!SS)return;const u=new SpeechSynthesisUtterance(s),p=pick();if(p){u.voice=p;u.lang=p.lang}else u.lang="en-GB";u.pitch=.75;u.rate=.9;u.volume=1;SS.cancel();SS.resume();SS.speak(u)}
if(SS){SS.getVoices();SS.onvoiceschanged=()=>SS.getVoices()}
fp.onclick=()=>{if(fp.classList.contains("scan"))return;fp.classList.add("scan");const w="WELCOME TO THE HIGHWAY PATROL GROUP DATABASE";document.getElementById("ip").textContent=w;chime();say(w);setTimeout(()=>{intro.classList.add("out");setTimeout(()=>intro.remove(),800)},3200)};
document.getElementById("tb").onclick=()=>{fillDrawer();document.getElementById("dr").classList.add("on")};
document.getElementById("dx").onclick=()=>document.getElementById("dr").classList.remove("on");
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("dr").classList.remove("on")});
render();
</script>
